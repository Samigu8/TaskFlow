name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate backend syntax
        run: node --check src/server.js

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow?schema=public
        run: npx prisma validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow?schema=public
        run: npx prisma generate

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow?schema=public
        run: npx prisma migrate deploy

      - name: Run backend integration tests
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow?schema=public
          JWT_SECRET: ci-only-taskflow-secret
        run: |
          node src/server.js > "$RUNNER_TEMP/taskflow-backend.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              npm test
              exit $?
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/taskflow-backend.log"
          echo "Backend did not become ready."
          exit 1

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
